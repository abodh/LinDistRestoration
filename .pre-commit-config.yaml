repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0 # Ruff version.
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi, pyproject]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        entry: uvx ty check . --ignore unresolved-import
        language: python
        pass_filenames: false
        always_run: true
        args: [--python=.venv/]
        additional_dependencies: [ty]
