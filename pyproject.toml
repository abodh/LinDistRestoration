[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ldrestoration"
version = "0.1.0"
description = "Linearized 3-phase unbalanced power distribution restoration using mixed-integer programming"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Abodh Poudyal", email = "abodh.poudyal@gmail.com" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "altdss[all]>=0.2.4",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "polars>=1.40.0",
    "pyomo>=6.10.0",
]

[project.optional-dependencies]
plot = [
    "plotly>=6.7.0",
]

[dependency-groups]
dev = [
    "prek>=0.3.9",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]

[project.urls]
Repository = "https://github.com/abodh/LinDistRestoration"
Documentation = "https://abodh.github.io/LinDistRestoration/"

[tool.ruff]
target-version = "py314"
src = ["ldrestoration"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]